<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics — {{ shop.name|default:"Tasty Zone" }}</title>
<link rel="manifest" href="/static/billing/manifest.json">
<meta name="theme-color" content="#0f1720">
<link rel="apple-touch-icon" href="/static/billing/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tasty Zone">
<style>
  :root {
    --bg: #0f1720; --panel: #17212c; --panel-border: #24313f;
    --text: #e8edf2; --muted: #8a97a3; --accent: #ff8a3d;
    --accent-2: #2dd4bf; --green: #34d399; --amber: #fbbf24; --red: #f87171; --blue: #60a5fa;
  }
  :root[data-theme="light"] {
    --bg: #f4f6f8; --panel: #ffffff; --panel-border: #dde3e8;
    --text: #16202a; --muted: #5b6b78; --accent: #ff8a3d;
    --accent-2: #0d7d70; --green: #059669; --amber: #b45309; --red: #dc2626; --blue: #2563eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    max-width: 900px; margin: 0 auto 20px; flex-wrap: wrap; gap: 12px;
  }
  header h1 { margin: 0; font-size: 22px; }
  header h1 span { color: var(--accent); }
  nav a { color: var(--muted); text-decoration: none; margin-left: 18px; font-size: 14px; }
  nav a.active { color: var(--accent-2); }
  .container { max-width: 900px; margin: 0 auto; }

  .panel { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px; padding: 18px 20px; margin-bottom: 20px; }
  .panel h2 { font-size: 13px; margin: 0 0 14px; color: var(--accent-2); text-transform: uppercase; letter-spacing: 0.04em; }

  .period-tabs { display: flex; gap: 6px; margin-bottom: 18px; }
  .period-tabs button {
    flex: 1; background: var(--panel); border: 1px solid var(--panel-border); color: var(--muted);
    padding: 8px; border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  .period-tabs button.active { color: var(--text); border-color: var(--accent); }

  .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
  .summary-card { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 10px; padding: 14px; text-align: center; }
  .summary-card .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  .summary-card .value { font-size: 20px; font-weight: 700; margin-top: 6px; }

  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .bar-row .bar-label { width: 110px; font-size: 12px; color: var(--muted); flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-row .bar-track { flex: 1; background: var(--bg); border-radius: 5px; overflow: hidden; height: 18px; }
  .bar-row .bar-fill { height: 100%; background: var(--accent); border-radius: 5px; }
  .bar-row .bar-value { width: 90px; text-align: right; font-size: 12px; font-weight: 600; flex-shrink: 0; }

  .donut-wrap { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .donut-legend { display: flex; flex-direction: column; gap: 8px; }
  .donut-legend .row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .donut-legend .swatch { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }

  .empty { color: var(--muted); font-size: 13.5px; padding: 10px 0; }
  #theme-toggle-btn {
    background: var(--panel); border: 1px solid var(--panel-border); color: var(--text);
    padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 13px;
  }
</style>
</head>
<body>

<header>
  <h1>{{ shop.name|default:"Tasty Zone" }} <span>Analytics</span></h1>
  <div style="display:flex; align-items:center; gap:8px;">
    <nav>
      <a href="/dashboard/">Dashboard</a>
      <a href="/history/">History</a>
      <a href="/analytics/" class="active">Analytics</a>
      <a href="/billing/">Billing</a>
    </nav>
    <button id="theme-toggle-btn" onclick="toggleTheme()" title="Toggle dark/light theme" style="margin-left:10px;">☀️</button>
  </div>
</header>

<div class="container">

  <div class="period-tabs">
    <button id="period-7" onclick="loadAnalytics(7)">Last 7 Days</button>
    <button id="period-30" onclick="loadAnalytics(30)">Last 30 Days</button>
    <button id="period-90" onclick="loadAnalytics(90)">Last 90 Days</button>
  </div>

  <div class="summary-grid">
    <div class="summary-card">
      <div class="label">Total Revenue</div>
      <div class="value" id="an-total-revenue">—</div>
    </div>
    <div class="summary-card">
      <div class="label">Total Bills</div>
      <div class="value" id="an-total-bills">—</div>
    </div>
    <div class="summary-card">
      <div class="label">Avg Bill Value</div>
      <div class="value" id="an-avg-bill">—</div>
    </div>
  </div>

  <div class="panel">
    <h2>Sales Trend</h2>
    <div id="trend-chart"></div>
  </div>

  <div class="panel">
    <h2>Payment Split</h2>
    <div class="donut-wrap">
      <div id="payment-donut"></div>
      <div class="donut-legend" id="payment-legend"></div>
    </div>
  </div>

  <div class="panel">
    <h2>Best-Selling Items</h2>
    <div id="top-items-chart"></div>
  </div>

  <div class="panel">
    <h2>Revenue by Category</h2>
    <div id="category-chart"></div>
  </div>

  <div class="panel">
    <h2>Busiest Hours</h2>
    <div id="hours-chart"></div>
  </div>

</div>

<script>
function initTheme() {
  const saved = localStorage.getItem('tasty-ops-theme') || 'dark';
  document.documentElement.dataset.theme = saved;
  const btn = document.getElementById('theme-toggle-btn');
  if (btn) btn.textContent = saved === 'light' ? '🌙' : '☀️';
}
function toggleTheme() {
  const current = document.documentElement.dataset.theme === 'light' ? 'light' : 'dark';
  const next = current === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('tasty-ops-theme', next);
  const btn = document.getElementById('theme-toggle-btn');
  if (btn) btn.textContent = next === 'light' ? '🌙' : '☀️';
}
initTheme();

function fmt(n) { return '\u20B9' + Number(n).toFixed(2); }
function fmtShort(n) {
  const num = Number(n);
  if (num >= 1000) return '\u20B9' + (num / 1000).toFixed(1) + 'k';
  return '\u20B9' + num.toFixed(0);
}

async function getJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${url} -> ${res.status}`);
  return res.json();
}

const CATEGORY_LABELS = {
  burger: 'Burgers', momo: 'Momos', home_made: 'Home Made', roll: 'Rolls',
  veg: 'Veg', non_veg: 'Non Veg', pasta: 'Pasta', seafood: 'Seafood', other: 'Other',
};

// A simple SVG bar chart — values on the y-axis, one bar per data point.
function renderBarChart(containerId, points, { color = 'var(--accent)', dateLabels = false } = {}) {
  const container = document.getElementById(containerId);
  if (!points.length) { container.innerHTML = '<div class="empty">No data for this period.</div>'; return; }

  const max = Math.max(...points.map(p => p.value), 1);
  const width = 700, height = 160, barGap = 3;
  const barWidth = Math.max(2, (width / points.length) - barGap);

  let bars = '';
  points.forEach((p, i) => {
    const barHeight = Math.max(2, (p.value / max) * (height - 24));
    const x = i * (barWidth + barGap);
    const y = height - barHeight - 20;
    bars += `<rect x="${x}" y="${y}" width="${barWidth}" height="${barHeight}" rx="2" fill="${color}"><title>${p.label}: ${fmt(p.value)}</title></rect>`;
  });

  // Show a handful of date labels along the bottom so it doesn't get crowded.
  let labels = '';
  if (dateLabels && points.length <= 31) {
    const step = Math.ceil(points.length / 7);
    points.forEach((p, i) => {
      if (i % step === 0) {
        const x = i * (barWidth + barGap);
        labels += `<text x="${x}" y="${height - 4}" font-size="9" fill="var(--muted)">${p.shortLabel || ''}</text>`;
      }
    });
  }

  container.innerHTML = `<svg viewBox="0 0 ${width} ${height}" style="width:100%; height:auto;">${bars}${labels}</svg>`;
}

function renderHorizontalBars(containerId, rows, { color = 'var(--accent)' } = {}) {
  const container = document.getElementById(containerId);
  if (!rows.length) { container.innerHTML = '<div class="empty">No data for this period.</div>'; return; }
  const max = Math.max(...rows.map(r => r.value), 1);
  container.innerHTML = rows.map(r => `
    <div class="bar-row">
      <div class="bar-label" title="${r.label}">${r.label}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(r.value / max) * 100}%; background:${color};"></div></div>
      <div class="bar-value">${r.valueLabel}</div>
    </div>
  `).join('');
}

function renderDonut(containerId, legendId, segments) {
  const container = document.getElementById(containerId);
  const legendEl = document.getElementById(legendId);
  const total = segments.reduce((sum, s) => sum + s.value, 0);
  if (total <= 0) {
    container.innerHTML = '<div class="empty">No payments recorded yet.</div>';
    legendEl.innerHTML = '';
    return;
  }

  const radius = 60, cx = 70, cy = 70, strokeWidth = 26;
  const circumference = 2 * Math.PI * radius;
  let offset = 0;
  let circles = '';
  segments.forEach(s => {
    if (s.value <= 0) return;
    const fraction = s.value / total;
    const dash = fraction * circumference;
    circles += `<circle cx="${cx}" cy="${cy}" r="${radius}" fill="none" stroke="${s.color}" stroke-width="${strokeWidth}"
      stroke-dasharray="${dash} ${circumference - dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"><title>${s.label}: ${fmt(s.value)}</title></circle>`;
    offset += dash;
  });

  container.innerHTML = `<svg width="140" height="140" viewBox="0 0 140 140">${circles}</svg>`;
  legendEl.innerHTML = segments.filter(s => s.value > 0).map(s => `
    <div class="row"><span class="swatch" style="background:${s.color};"></span>${s.label}: ${fmt(s.value)} (${((s.value / total) * 100).toFixed(0)}%)</div>
  `).join('');
}

let currentPeriod = 30;

async function loadAnalytics(days) {
  currentPeriod = days;
  document.querySelectorAll('.period-tabs button').forEach(b => b.classList.remove('active'));
  document.getElementById(`period-${days}`).classList.add('active');

  try {
    const data = await getJSON(`/api/bills/analytics/?days=${days}`);

    document.getElementById('an-total-revenue').textContent = fmt(data.total_revenue);
    document.getElementById('an-total-bills').textContent = data.total_bills;
    document.getElementById('an-avg-bill').textContent = fmt(data.avg_bill_value);

    const trendPoints = data.daily_trend.map(t => ({
      value: Number(t.total),
      label: t.date,
      shortLabel: new Date(t.date + 'T00:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }),
    }));
    renderBarChart('trend-chart', trendPoints, { color: 'var(--accent)', dateLabels: true });

    renderDonut('payment-donut', 'payment-legend', [
      { label: 'Cash', value: Number(data.payment_breakdown.cash), color: 'var(--green)' },
      { label: 'GPay / UPI', value: Number(data.payment_breakdown.upi), color: 'var(--blue)' },
      { label: 'Other', value: Number(data.payment_breakdown.other), color: 'var(--amber)' },
    ]);

    renderHorizontalBars('top-items-chart', data.top_items.map(i => ({
      label: `${i.name} (x${i.quantity})`,
      value: Number(i.revenue),
      valueLabel: fmt(i.revenue),
    })), { color: 'var(--accent)' });

    renderHorizontalBars('category-chart', data.category_breakdown.map(c => ({
      label: CATEGORY_LABELS[c.category] || c.category,
      value: Number(c.revenue),
      valueLabel: fmt(c.revenue),
    })), { color: 'var(--accent-2)' });

    const hourPoints = data.peak_hours.map(h => ({
      value: h.count,
      label: `${h.hour}:00`,
      shortLabel: h.hour % 3 === 0 ? `${h.hour}h` : '',
    }));
    renderBarChart('hours-chart', hourPoints, { color: 'var(--blue)', dateLabels: true });

  } catch (e) {
    document.getElementById('trend-chart').innerHTML = `<div class="empty">Could not load analytics: ${e.message}</div>`;
  }
}

loadAnalytics(30);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch((e) => console.warn('SW registration failed:', e));
  });
}
</script>

</body>
</html>
