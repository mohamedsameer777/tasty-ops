<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Tasty Zone Smart Ops</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f1720;
    color: #e8edf2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card {
    background: #17212c;
    border: 1px solid #24313f;
    border-radius: 12px;
    padding: 32px 36px;
    width: 320px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h1 span { color: #ff8a3d; }
  .subtitle { color: #8a97a3; font-size: 13px; margin-bottom: 24px; }
  label { display: block; font-size: 13px; color: #8a97a3; margin-bottom: 6px; margin-top: 16px; }
  input {
    width: 100%;
    background: #0f1720;
    border: 1px solid #24313f;
    border-radius: 8px;
    padding: 10px 12px;
    color: #e8edf2;
    font-size: 14px;
    box-sizing: border-box;
  }
  input:focus { outline: none; border-color: #ff8a3d; }
  button {
    width: 100%;
    margin-top: 22px;
    background: #ff8a3d;
    border: none;
    border-radius: 8px;
    padding: 11px;
    color: #0f1720;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  .errorlist { color: #f87171; font-size: 13px; margin: 12px 0 0; padding: 0; list-style: none; }
  .footer-link { text-align: center; margin-top: 18px; font-size: 13px; color: #8a97a3; }
  .footer-link a { color: #ff8a3d; text-decoration: none; }
</style>
</head>
<body>
  <div class="card">
    <img src="/static/billing/logo.png" alt="Tasty Zone" style="height:64px; width:64px; border-radius:50%; object-fit:cover; margin-bottom:12px;">
    <h1>Tasty Zone <span>Smart Ops</span></h1>
    <div class="subtitle">Sign in to continue</div>
    <form method="post">
      {% csrf_token %}
      {{ form.non_field_errors }}
      <label for="id_username">Username</label>
      <input type="text" name="username" id="id_username" required autofocus>
      <label for="id_password">Password</label>
      <input type="password" name="password" id="id_password" required>
      <button type="submit">Sign in</button>
    </form>
    <div class="footer-link">New shop? <a href="{% url 'signup' %}">Create an account</a></div>
  </div>
</body>
</html>
